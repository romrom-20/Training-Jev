<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
<title id="title">Latent Decisions — small probes, testable claims</title><desc id="desc">A frozen language model activation and a semantic question enter a small shared readout. Its probabilities are evaluated for prediction, calibration and behavioral influence.</desc>
<rect width="1280" height="380" fill="#f5f4ef"/><path d="M44 75H1236" stroke="#cbd3d0"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#202c3b">
<text x="44" y="48" font-size="16" letter-spacing="3">LATENT DECISIONS</text><text x="1236" y="48" font-size="12" text-anchor="end" fill="#61707c">OPEN RESEARCH · LAPTOP SCALE</text>
<text x="44" y="146" font-size="48" font-weight="700" letter-spacing="-2">Small probes.</text><text x="44" y="201" font-size="48" font-weight="700" letter-spacing="-2">Testable claims.</text>
<text x="46" y="245" font-size="18" fill="#61707c">Ask a precise question of a hidden state.</text><text x="46" y="271" font-size="18" fill="#61707c">Measure where the answer holds up.</text>
<g fill="none" stroke="#96a8ab" stroke-width="1.5"><rect x="585" y="118" width="174" height="62" rx="5"/><rect x="585" y="210" width="174" height="62" rx="5"/><path d="M759 149H802V195H832M759 241H802V195"/><rect x="832" y="154" width="160" height="82" rx="5"/><path d="M992 195H1030"/><rect x="1030" y="144" width="198" height="102" rx="5"/></g>
<text x="672" y="143" font-size="13" text-anchor="middle" fill="#61707c">FROZEN TARGET</text><text x="672" y="165" font-size="18" text-anchor="middle">Activation h</text><text x="672" y="235" font-size="13" text-anchor="middle" fill="#61707c">BOUNDED HYPOTHESIS</text><text x="672" y="257" font-size="18" text-anchor="middle">Question q</text>
<text x="912" y="187" font-size="17" text-anchor="middle">Shared readout</text><text x="912" y="211" font-size="14" text-anchor="middle" fill="#61707c">Low-rank · supervised</text><text x="1129" y="176" font-size="14" text-anchor="middle" fill="#167d8d">P(y | h, q)</text><text x="1129" y="204" font-size="16" text-anchor="middle">Predict · Calibrate</text><text x="1129" y="228" font-size="16" text-anchor="middle">Test interventions</text>
<path d="M44 321H1236" stroke="#cbd3d0"/><text x="44" y="351" font-size="13" fill="#61707c">A controlled research prototype. Not a general-purpose activation oracle or a deception detector.</text>
</g></svg>
