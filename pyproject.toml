[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latent-decisions"
version = "0.1.0"
description = "Small query-conditioned activation probes with calibration and causal checks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "torch>=2.6,<3", "transformers>=4.51,<5", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
decision-engine = ["laya==0.3.20"]

[project.scripts]
latent-decisions = "latent_decisions.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
